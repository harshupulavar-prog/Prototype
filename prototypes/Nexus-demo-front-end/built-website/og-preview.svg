<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="10%" r="65%">
      <stop offset="0%" stop-color="#C8000A" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#C8000A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8000A" />
      <stop offset="100%" stop-color="#FF3B30" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="6" fill="url(#accent)" />

  <!-- Grid decoration -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630" />
    <line x1="280" y1="0" x2="280" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="680" y1="0" x2="680" y2="630" />
    <line x1="880" y1="0" x2="880" y2="630" />
    <line x1="1080" y1="0" x2="1080" y2="630" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="440" x2="1200" y2="440" />
  </g>

  <!-- Header: Brand pill -->
  <g transform="translate(80, 60)">
    <rect width="44" height="44" rx="10" fill="#C8000A" />
    <path d="M14 32 V12 L30 32 V12" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="58" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FF8A80" letter-spacing="2">KAARA TECHNOLOGIES</text>
    <text x="58" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#9CA3AF">Enterprise AI Platforms</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="80" y="175" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">Nexus Collections Command Centre</text>
  <text x="80" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#9CA3AF">
    Early warning signals, omnichannel borrower treatment & predictive recovery
  </text>

  <!-- Proof banner -->
  <g transform="translate(80, 250)">
    <rect width="1040" height="52" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <rect x="14" y="12" width="94" height="28" rx="6" fill="#C8000A" />
    <text x="61" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">PROOF</text>
    <text x="122" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#F1F5F9">
      Flags 7 in 10 future defaulters 30 to 60 days before the first missed EMI
    </text>
    <text x="730" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">
      · Illustrative benchmark
    </text>
  </g>

  <!-- Three Outcome Pillars -->
  <g transform="translate(80, 330)">
    <!-- Pillar 1 -->
    <g transform="translate(0, 0)">
      <rect width="328" height="180" rx="14" fill="url(#cardBg)" stroke="#374151" stroke-width="1" />
      <rect x="20" y="20" width="36" height="36" rx="8" fill="#3B82F6" fill-opacity="0.15" />
      <path d="M28 42 L38 32 L48 38 L48 26" stroke="#60A5FA" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#60A5FA">Fewer roll-forwards</text>
      <text x="20" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#D1D5DB">Pre-due early warning flags distress</text>
      <text x="20" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#9CA3AF">30 to 60 days before missed EMI</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(356, 0)">
      <rect width="328" height="180" rx="14" fill="url(#cardBg)" stroke="#374151" stroke-width="1" />
      <rect x="20" y="20" width="36" height="36" rx="8" fill="#10B981" fill-opacity="0.15" />
      <circle cx="34" cy="34" r="5" stroke="#34D399" stroke-width="2" fill="none" />
      <circle cx="44" cy="38" r="4" stroke="#34D399" stroke-width="2" fill="none" />
      <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#34D399">Fewer field visits</text>
      <text x="20" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#D1D5DB">Omnichannel digital resolution</text>
      <text x="20" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#9CA3AF">cures accounts before field visits</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(712, 0)">
      <rect width="328" height="180" rx="14" fill="url(#cardBg)" stroke="#374151" stroke-width="1" />
      <rect x="20" y="20" width="36" height="36" rx="8" fill="#F59E0B" fill-opacity="0.15" />
      <path d="M28 38 L34 44 L46 28" stroke="#FBBF24" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#FBBF24">Higher cure rate</text>
      <text x="20" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#D1D5DB">Portfolio memory matches proven</text>
      <text x="20" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#9CA3AF">historical plans to maximize recovery</text>
    </g>
  </g>

  <!-- Footer link -->
  <g transform="translate(80, 560)">
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#9CA3AF">demo.kaara.ai</text>
    <text x="1040" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#6B7280" text-anchor="end">Works with what you already run · Built by Kaara Technologies</text>
  </g>
</svg>

